<!DOCTYPE html>
<html lang="fr">
    <head>
        <title>Page de Sondage</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style_sondage.css">
        <link rel="icon" type="image/png" href="./Asset/Logo.png">
    </head>
    <body>
        <header>
            <h1 id="titre" class="text_blanc">Sondage</h1>
        </header>
        
        <input type="checkbox" id="theme_changer">

        <div id="theme_control">
            <label for="theme_changer" id="theme_button">
                <img id="button_image" src="Asset/Checkbox.png" alt="changer thème">
            </label>
            <span class="text_blanc" id ="theme_text"> changer thème</span>
        </div>

        <div class="flex">
            <table id = "table">
                <tr>
                    <td>
                    <nav>
                        <a href="./PersonaXMinecraftHomePage.html" class="image-button">Accueil</a>
                        <br>

                        <a href="./minecraft.html" class="image-button">Minecraft</a>
                        <br>

                        <a href="lien.html" class="image-button">Persona 5</a>
                        <br>

                        <a href="./sondage.html" class="image-button">Sondage</a>
                    </nav>
                    </td>
                </tr>
            </table>

            <form id="sondage" action="mailto:example@mail.com" method="POST" enctype="text/plain">

                <p class="text_blanc">Qu'en pensez-vous ? On vous répond !</p>

                <label for="pseudo" class="text_blanc">Pseudo:</label>
                <input type="text" id="pseudo" name="pseudo" required>
                <br>

                <label for="quantite" class="text_blanc">Votre Age:</label>
                <input type="number" id="quantite" name="age" min="1" max="99" placeholder="1-99" required>
                <br>

                <label for="email" class="text_blanc">Votre Mail:</label>
                <input type="email" id="email" name="email" placeholder="example@mail.com" required>
                <br>

                <label for="phone" class="text_blanc">Numéro de Téléphone:</label>
                <input type="tel" id="phone" name="phone" placeholder="+(33)123-45-678" required>
                <br>

                <label for="avis" class="text_blanc">Votre avis :</label>
                <textarea id="avis" name="avis" placeholder="Des choses à nous dire ?" required></textarea>
                <br>

                <button type="submit">Envoyer</button>

            </form>


        </div>
        <script>
            document.getElementById("sondage").addEventListener("submit", function (event) {
                event.preventDefault();

                const form = event.currentTarget;
                const subject = encodeURIComponent("Nouveau sondage !");
                const body = encodeURIComponent(
                    "Pseudo : " + form.pseudo.value + "\n" +
                    "Age : " + form.age.value + "\n" +
                    "Mail : " + form.email.value + "\n" +
                    "Telephone : " + form.phone.value + "\n" +
                    "Avis : " + form.avis.value
                );

                window.location.href = "mailto:example@mail.com?subject=" + subject + "&body=" + body;
            });
        </script>
        <footer>
            <img id = "logo" src="./Asset/Logo.png" alt ="logo">
        </footer>
    </body>
</html>
